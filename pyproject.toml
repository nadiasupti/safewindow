[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safewindow"
version = "0.1.0"
description = "Village road-isolation timelines for the June 2022 Sunamganj flood"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "streamlit>=1.35",
    "streamlit-folium>=0.6",
    "folium>=0.12",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[tool.setuptools]
packages = ["safewindow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
