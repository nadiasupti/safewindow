[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safewindow"
version = "0.1.0"
description = "Village road-isolation timelines for the June 2022 Sunamganj flood"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["safewindow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
